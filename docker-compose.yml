services:
    laravel.test:
        image: sail-8.3/app:latest
        container_name: eli_boutique_app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
            - 'sql1004.site4now.net:204.188.197.251'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5174}:5173'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
            - './docker/opcache.ini:/etc/php/8.3/cli/conf.d/99-opcache.ini:ro'
        networks:
            - sail

networks:
    sail:
        driver: bridge
